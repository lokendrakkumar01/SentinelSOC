version: '3.8'

services:
  # ─── MongoDB ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sentinelsoc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-sentinelsoc}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-sentinelsoc_secret}
      MONGO_INITDB_DATABASE: sentinelsoc
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelsoc-net

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinelsoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sentinelsoc-net

  # ─── Node.js Backend Server ──────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sentinelsoc-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER:-sentinelsoc}:${MONGO_PASSWORD:-sentinelsoc_secret}@mongodb:27017/sentinelsoc?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-sentinelsoc_jwt_super_secret_key_2024}
      JWT_EXPIRY: 24h
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@sentinelsoc.io}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/dashboard/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sentinelsoc-net

  # ─── React Frontend ─────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sentinelsoc-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - sentinelsoc-net

  # ─── Java Log Agent ─────────────────────────────────────
  log-agent:
    build:
      context: ./log-agent
      dockerfile: Dockerfile
    container_name: sentinelsoc-log-agent
    restart: unless-stopped
    environment:
      API_URL: http://server:5000/api/logs
      LOG_INTERVAL: 1500
    depends_on:
      server:
        condition: service_healthy
    networks:
      - sentinelsoc-net

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  sentinelsoc-net:
    driver: bridge
